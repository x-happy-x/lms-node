services:
  lms-node:
    image: lms-node:latest
    container_name: ${CONTAINER_NAME:-lms-node}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NODE_HMAC_SECRET: ${NODE_HMAC_SECRET:-change-me}
      NODE_MAX_PARALLEL: ${NODE_MAX_PARALLEL:-1}
      NODE_DOWNLOAD_DIR: ${NODE_DOWNLOAD_DIR:-/downloads}
    volumes:
      - ${REMOTE_DOWNLOADS_DIR:-./downloads}:/downloads
