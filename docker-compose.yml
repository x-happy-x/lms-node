services:
  lms-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-node:latest
    container_name: lms-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      NODE_HMAC_SECRET: ${NODE_HMAC_SECRET:-change-me}
      NODE_MAX_PARALLEL: ${NODE_MAX_PARALLEL:-1}
    volumes:
      - ./downloads:/downloads
