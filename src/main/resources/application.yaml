spring:
  application:
    # Service name in logs/actuator.
    name: lms-node
  profiles:
    # Default profile for local run without Docker.
    default: local

server:
  # Host/interface to bind HTTP server.
  # 0.0.0.0 = listen on all interfaces.
  address: ${SERVER_ADDRESS:0.0.0.0}
  # HTTP port.
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      # Keep actuator minimal in MVP.
      exposure:
        include: health,info
  endpoint:
    health:
      # K8s/nginx/docker probes friendly output.
      probes:
        enabled: true

node:
  # Download destination directory on node filesystem.
  # Profile files can override this for prod/test/docker.
  download-dir: ${NODE_DOWNLOAD_DIR:./downloads}
  # Max parallel job workers; MVP default is 1.
  max-parallel: ${NODE_MAX_PARALLEL:1}
  # JSON file with job state so jobs survive restarts/redeploys; empty = memory only.
  state-file: ${NODE_STATE_FILE:${node.download-dir}/.lms-node/jobs.json}
  # Continue jobs that were queued/running when the node stopped (false = leave them PAUSED).
  resume-on-startup: ${NODE_RESUME_ON_STARTUP:true}
  # Binary names/paths for external tools.
  tools:
    ytdlp: ${YTDLP_BIN:yt-dlp}
    aria2c: ${ARIA2C_BIN:aria2c}
    # Optional: thumbnails for image/video outputs (GET /api/jobs/{id}/preview).
    ffmpeg: ${FFMPEG_BIN:ffmpeg}
  torrent:
    # Minutes to keep seeding after a torrent completes; 0 = stop right away.
    seed-time-minutes: ${TORRENT_SEED_TIME_MINUTES:0}
    # BitTorrent/DHT listen port or range; publish it for inbound peers.
    listen-port: ${TORRENT_LISTEN_PORT:6881-6999}
  auth:
    # Allowed timestamp drift in seconds.
    allowed-skew-seconds: ${NODE_AUTH_ALLOWED_SKEW_SECONDS:120}
    # Nonce replay protection window in seconds.
    nonce-ttl-seconds: ${NODE_AUTH_NONCE_TTL_SECONDS:600}
    # Clients map is profile-specific (local/prod/test/local-docker).
    clients: {}

# Job state is kept in memory and mirrored to node.state-file (no DB).
# If/when persistence is added, configure datasource in profile files:
# spring:
#   datasource:
#     url: jdbc:postgresql://127.0.0.1:5432/lms_node
#     username: lms_node
#     password: change-me
